[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "folder_remove_empty"
dynamic = ["version"]
description = "folder_remove_empty - remove every empty folder below a start folder, deepest first, from a tkinter window or the terminal"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "neunmalelf" },
]
keywords = ["empty", "folder", "directory", "rmdir", "cleanup", "tkinter", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
# stdlib only by design: tkinter is the window, everything else is the
# standard library, so there is no runtime dependency at all.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "nuitka",
]

[project.urls]
Homepage = "https://github.com/neunmalelf/folder_remove_empty"
Repository = "https://github.com/neunmalelf/folder_remove_empty"
Documentation = "https://github.com/neunmalelf/folder_remove_empty/blob/master/README.md"
"Bug Tracker" = "https://github.com/neunmalelf/folder_remove_empty/issues"

[tool.setuptools.dynamic]
# PEP 440 forbids the trailing "Z" of the repository stamp, so the
# distribution version is the derived __version__ of the version module.
version = {attr = "remove_empty_folder_version.__version__"}

[project.scripts]
folder_remove_empty = "folder_remove_empty:main"

[tool.setuptools]
py-modules = ["folder_remove_empty", "remove_empty_folder_version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
]

[tool.mypy]
python_version = "3.13"
files = ["folder_remove_empty.py", "remove_empty_folder_version.py", "tests"]
# the dev tools (pytest) ship no stubs; runtime is stdlib only
ignore_missing_imports = true
