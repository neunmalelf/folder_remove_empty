site_name: ddpico
site_description: ddpico - a commandline and API-driven tool plus a granular, function-based dd command toolset with a REPL, pipe, scripting, and LSP
site_url: ""
docs_dir: docs
site_dir: site

theme:
  name: material
  favicon: assets/icons/folder_remove_empty-32.png
  logo: assets/folder-remove-icon.svg
  palette:
    - scheme: default
      primary: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_signature_annotations: true
            docstring_style: google

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.tabbed

nav:
  - Home: index.md
  - Guides:
      - Architecture: api_architecture_basics.md
      - BusyBox cheat sheet: busybox_cheat_sheet.md
      - Quick cheat sheet: bbpy_cheatsheet.md
      - TUI model: tui/index.md
  - API Reference: api.md
  - Command Reference: commands.md
